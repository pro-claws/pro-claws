AWSTemplateFormatVersion: '2010-09-09'
Description: Vendistri migration foundation. No DNS changes or production consumers.
Parameters:
  Name:
    Type: String
    Default: vendistri-aws
    AllowedPattern: '[a-z][a-z0-9-]{2,24}'
  OperatorCidr:
    Type: String
    AllowedPattern: '(?:[0-9]{1,3}\.){3}[0-9]{1,3}/32'
  SshKeyName:
    Type: String
  ZoneA:
    Type: AWS::EC2::AvailabilityZone::Name
  ZoneB:
    Type: AWS::EC2::AvailabilityZone::Name
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetA:
    Type: AWS::EC2::Subnet::Id
  SubnetB:
    Type: AWS::EC2::Subnet::Id
  LightsailCidr:
    Type: String
    AllowedPattern: '(?:[0-9]{1,3}\.){3}[0-9]{1,3}/(?:1[6-9]|2[0-9]|3[0-2])'
Rules:
  DistinctZones:
    Assertions:
      - Assert: !Not [!Equals [!Ref ZoneA, !Ref ZoneB]]
        AssertDescription: Application hosts must use distinct Availability Zones.
Resources:
  HostA:
    Type: AWS::Lightsail::Instance
    Properties:
      InstanceName: !Sub '${Name}-a'
      AvailabilityZone: !Ref ZoneA
      BlueprintId: ubuntu_22_04
      BundleId: xlarge_3_0
      KeyPairName: !Ref SshKeyName
      Networking:
        Ports:
          - FromPort: 22
            ToPort: 22
            Protocol: tcp
            Cidrs: [!Ref OperatorCidr]
      UserData: |
        #!/bin/sh
        set -eu
        umask 077
        install -d -m 0700 /etc/vendistri
        printf '%s\n' rehearsal-unconfigured > /etc/vendistri/migration-stage
        systemctl mask vendistri-celery-beat.service vendistri-bg-tasks.service vendistri-telemetry-worker.service vendistri-telemetry-intake.service vendistri-documents-worker.service vendistri-shipping-worker.service vendistri-health-worker.service
      Tags:
        - {Key: Application, Value: vendistri}
        - {Key: Stage, Value: migration-rehearsal}
  HostB:
    Type: AWS::Lightsail::Instance
    Properties:
      InstanceName: !Sub '${Name}-b'
      AvailabilityZone: !Ref ZoneB
      BlueprintId: ubuntu_22_04
      BundleId: xlarge_3_0
      KeyPairName: !Ref SshKeyName
      Networking:
        Ports:
          - FromPort: 22
            ToPort: 22
            Protocol: tcp
            Cidrs: [!Ref OperatorCidr]
      UserData: |
        #!/bin/sh
        set -eu
        umask 077
        install -d -m 0700 /etc/vendistri
        printf '%s\n' rehearsal-unconfigured > /etc/vendistri/migration-stage
        systemctl mask vendistri-celery-beat.service vendistri-bg-tasks.service vendistri-telemetry-worker.service vendistri-telemetry-intake.service vendistri-documents-worker.service vendistri-shipping-worker.service vendistri-health-worker.service
      Tags:
        - {Key: Application, Value: vendistri}
        - {Key: Stage, Value: migration-rehearsal}
  LoadBalancer:
    Type: AWS::Lightsail::LoadBalancer
    Properties:
      LoadBalancerName: !Sub '${Name}-web'
      InstancePort: 80
      HealthCheckPath: /vendistri/be/health/ready
      SessionStickinessEnabled: false
      Tags:
        - {Key: Application, Value: vendistri}
        - {Key: Stage, Value: migration-rehearsal}
  Database:
    Type: AWS::Lightsail::Database
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      RelationalDatabaseName: !Sub '${Name}-postgres'
      RelationalDatabaseBlueprintId: postgres_14
      RelationalDatabaseBundleId: small_ha_2_0
      MasterDatabaseName: vendistri_rehearsal
      MasterUsername: vendistri_admin
      PubliclyAccessible: false
      BackupRetention: true
      PreferredBackupWindow: '05:00-05:30'
      PreferredMaintenanceWindow: 'sun:07:00-sun:07:30'
      Tags:
        - {Key: Application, Value: vendistri}
        - {Key: Stage, Value: migration-rehearsal}
  BrokerSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Description: Vendistri migration broker authentication. Never export to source or logs.
      GenerateSecretString:
        SecretStringTemplate: '{"username":"default"}'
        GenerateStringKey: password
        PasswordLength: 40
        ExcludePunctuation: true
      Tags:
        - {Key: Application, Value: vendistri}
  DataSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Private Valkey and EFS access from peered Lightsail hosts only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 6379, ToPort: 6379, CidrIp: !Ref LightsailCidr}
        - {IpProtocol: tcp, FromPort: 2049, ToPort: 2049, CidrIp: !Ref LightsailCidr}
      Tags:
        - {Key: Application, Value: vendistri}
  BrokerSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      Description: Vendistri broker subnets across two Availability Zones
      SubnetIds: [!Ref SubnetA, !Ref SubnetB]
  BrokerParameters:
    Type: AWS::ElastiCache::ParameterGroup
    Properties:
      CacheParameterGroupFamily: valkey7
      Description: Never evict queued work to make space for cache values
      Properties:
        maxmemory-policy: noeviction
  Broker:
    Type: AWS::ElastiCache::ReplicationGroup
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      ReplicationGroupDescription: Vendistri isolated migration broker
      ReplicationGroupId: !Sub '${Name}-broker'
      Engine: valkey
      EngineVersion: '7.2'
      CacheNodeType: cache.t4g.micro
      NumCacheClusters: 2
      ClusterMode: disabled
      AutomaticFailoverEnabled: true
      MultiAZEnabled: true
      PreferredCacheClusterAZs: [!Ref ZoneA, !Ref ZoneB]
      CacheSubnetGroupName: !Ref BrokerSubnetGroup
      CacheParameterGroupName: !Ref BrokerParameters
      SecurityGroupIds: [!Ref DataSecurityGroup]
      TransitEncryptionEnabled: true
      AtRestEncryptionEnabled: true
      AuthToken: !Sub '{{resolve:secretsmanager:${BrokerSecret}:SecretString:password}}'
      SnapshotRetentionLimit: 7
      AutoMinorVersionUpgrade: true
      Tags:
        - {Key: Application, Value: vendistri}
        - {Key: Stage, Value: migration-rehearsal}
  Media:
    Type: AWS::EFS::FileSystem
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Encrypted: true
      ThroughputMode: elastic
      BackupPolicy: {Status: ENABLED}
      FileSystemPolicy:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: 'elasticfilesystem:Client*'
            Resource: '*'
            Condition:
              Bool: {aws:SecureTransport: 'false'}
      FileSystemTags:
        - {Key: Application, Value: vendistri}
        - {Key: Stage, Value: migration-rehearsal}
  MediaMountA:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref Media
      SubnetId: !Ref SubnetA
      SecurityGroups: [!Ref DataSecurityGroup]
  MediaMountB:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref Media
      SubnetId: !Ref SubnetB
      SecurityGroups: [!Ref DataSecurityGroup]
Outputs:
  HostAName: {Value: !Ref HostA}
  HostBName: {Value: !Ref HostB}
  HostAPublicIp: {Value: !GetAtt HostA.PublicIpAddress}
  HostBPublicIp: {Value: !GetAtt HostB.PublicIpAddress}
  DatabaseName: {Value: !Ref Database}
  BrokerHost: {Value: !GetAtt Broker.PrimaryEndPoint.Address}
  BrokerSecretArn: {Value: !Ref BrokerSecret}
  MediaFileSystemId: {Value: !Ref Media}
  LoadBalancerName: {Value: !Ref LoadBalancer}
